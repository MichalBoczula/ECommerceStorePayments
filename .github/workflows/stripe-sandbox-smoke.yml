name: Stripe sandbox smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/stripe-sandbox-smoke.yml
      - scripts/stripe_sandbox_smoke.py
      - tests/unit/external_providers/test_stripe_sandbox_smoke.py

permissions:
  contents: read

concurrency:
  group: stripe-sandbox-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-checkout:
    # Only manual runs or the repository owner's same-repository smoke PRs use the secret.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: bash scripts/ci.sh sync
      - name: Create, verify and expire a real sandbox checkout
        env:
          PAYMENTS_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET }}
        run: uv run --no-sync python -m scripts.stripe_sandbox_smoke
