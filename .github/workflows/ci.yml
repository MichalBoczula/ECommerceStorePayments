name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Audit locked runtime and development dependencies
        run: bash scripts/ci.sh audit

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Check formatting
        run: bash scripts/ci.sh format
      - name: Lint
        run: bash scripts/ci.sh lint
      - name: Type check
        run: bash scripts/ci.sh types
      - name: Check architecture boundaries
        run: bash scripts/ci.sh architecture
      - name: Verify generated Orders Kiota client
        run: bash scripts/ci.sh orders-client
      - name: Check operation links
        run: bash scripts/ci.sh links
      - name: Export and lint generated OpenAPI
        run: bash scripts/ci.sh openapi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payments-openapi
          path: artifacts/verification/openapi.json
          if-no-files-found: error
      - name: Build and verify wheel
        run: bash scripts/ci.sh build

  suites:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        suite: [domain, application, infrastructure, externalproviders, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run ${{ matrix.suite }} suite with reports
        run: bash scripts/ci.sh suite "${{ matrix.suite }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-${{ matrix.suite }}-reports
          path: artifacts/verification/${{ matrix.suite }}/
          if-no-files-found: error

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke test runtime image
        run: bash scripts/ci.sh container
      - name: Scan the smoke-tested image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce-store-payments:ci
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record scanned image identity
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' ecommerce-store-payments:ci >> "$GITHUB_STEP_SUMMARY"

  final-gate:
    needs: [quality, suites, container, dependency-audit, dependency-review, secret-scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source, suites and security checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          for check in QUALITY SUITES CONTAINER AUDIT SECRET; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != success ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done
          case "$EVENT_NAME" in
            pull_request) expected_review=success ;;
            push) expected_review=skipped ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$REVIEW_RESULT" != "$expected_review" ]]; then
            echo "Dependency Review must be $expected_review on $EVENT_NAME; actual result: $REVIEW_RESULT" >&2
            exit 1
          fi
