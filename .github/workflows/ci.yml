name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Check formatting
        run: bash scripts/ci.sh format
      - name: Lint
        run: bash scripts/ci.sh lint
      - name: Type check
        run: bash scripts/ci.sh types
      - name: Check architecture boundaries
        run: bash scripts/ci.sh architecture
      - name: Check operation links
        run: bash scripts/ci.sh links
      - name: Export and lint generated OpenAPI
        run: bash scripts/ci.sh openapi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payments-openapi
          path: artifacts/verification/openapi.json
          if-no-files-found: error
      - name: Unit tests
        run: bash scripts/ci.sh test
      - name: MongoDB integration tests
        run: bash scripts/ci.sh integration
      - name: HTTP acceptance scenarios
        run: bash scripts/ci.sh acceptance
      - name: Build and verify wheel
        run: bash scripts/ci.sh build
