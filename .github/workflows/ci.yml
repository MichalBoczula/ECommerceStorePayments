name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Audit locked runtime and development dependencies
        run: bash scripts/ci.sh audit

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Check formatting
        run: bash scripts/ci.sh format
      - name: Lint
        run: bash scripts/ci.sh lint
      - name: Type check
        run: bash scripts/ci.sh types
      - name: Check architecture boundaries
        run: bash scripts/ci.sh architecture
      - name: Verify generated Orders Kiota client
        run: bash scripts/ci.sh orders-client
      - name: Check operation links
        run: bash scripts/ci.sh links
      - name: Export and lint generated OpenAPI
        run: bash scripts/ci.sh openapi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payments-openapi
          path: artifacts/verification/openapi.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-contract
          path: |
            artifacts/verification/openapi.json
            artifacts/verification/operation-links.json
            artifacts/verification/flows.json
            artifacts/verification/validation-policies.json
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify wheel
        run: bash scripts/ci.sh build

  domain-unit-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run Domain suite with reports
        run: bash scripts/ci.sh suite domain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-domain-reports
          path: artifacts/verification/domain/
          if-no-files-found: error

  application-unit-tests:
    needs: quality
    # Match the Mongo-compatible runner validated by Users and Orders/Invoices.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run Application suite with reports
        run: bash scripts/ci.sh suite application
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-application-reports
          path: artifacts/verification/application/
          if-no-files-found: error

  infrastructure-integration-tests:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run Infrastructure suite with reports
        run: bash scripts/ci.sh suite infrastructure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-infrastructure-reports
          path: artifacts/verification/infrastructure/
          if-no-files-found: error

  external-providers-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run ExternalProviders suite with reports
        run: bash scripts/ci.sh suite externalproviders
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-externalproviders-reports
          path: artifacts/verification/externalproviders/
          if-no-files-found: error

  acceptance-tests:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check lock and install
        run: bash scripts/ci.sh sync
      - name: Run Acceptance suite with reports
        run: bash scripts/ci.sh suite acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payments-acceptance-reports
          path: artifacts/verification/acceptance/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-allure-results
          path: artifacts/allure-results/acceptance/
          if-no-files-found: error
          retention-days: 7

  documentation-bundle:
    needs: [quality, acceptance-tests]
    uses: MichalBoczula/ECommerceStore.LiveDocs/.github/workflows/package-producer.yml@93ce670ba4bcd56ed4c0ca0ec75bf82ffaef7098
    with:
      tooling-ref: 93ce670ba4bcd56ed4c0ca0ec75bf82ffaef7098
      project: payments
      features: tests/acceptance/features

  quality-gate:
    needs: [quality, domain-unit-tests, application-unit-tests, infrastructure-integration-tests, external-providers-tests, acceptance-tests, documentation-bundle, dependency-audit, dependency-review, secret-scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source, suites and security checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOMAIN_RESULT: ${{ needs.domain-unit-tests.result }}
          APPLICATION_RESULT: ${{ needs.application-unit-tests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure-integration-tests.result }}
          EXTERNAL_PROVIDERS_RESULT: ${{ needs.external-providers-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-bundle.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          for check in QUALITY DOMAIN APPLICATION INFRASTRUCTURE EXTERNAL_PROVIDERS ACCEPTANCE DOCUMENTATION AUDIT SECRET; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != success ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done
          case "$EVENT_NAME" in
            pull_request) expected_review=success ;;
            push) expected_review=skipped ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$REVIEW_RESULT" != "$expected_review" ]]; then
            echo "Dependency Review must be $expected_review on $EVENT_NAME; actual result: $REVIEW_RESULT" >&2
            exit 1
          fi

  container:
    needs: quality-gate
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke test runtime image
        run: bash scripts/ci.sh container
      - name: Scan the smoke-tested image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce-store-payments:ci
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record scanned image identity
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' ecommerce-store-payments:ci >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-payments-api
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-payments:ci)"
          test -n "$scanned_id"

          docker tag ecommerce-store-payments:ci "$sha_tag"
          docker tag ecommerce-store-payments:ci "$latest_tag"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"

          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from scanned image $scanned_id with digest $sha_digest" >> "$GITHUB_STEP_SUMMARY"

  final-gate:
    needs: [quality-gate, container]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require quality gate and scanned image
        env:
          QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for check in QUALITY_GATE CONTAINER; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != success ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done

  archive-documentation:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.final-gate.result == 'success' }}
    needs: final-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACCOUNT: ${{ vars.LIVEDOCS_STORAGE_ACCOUNT || 'stecproductsdevmb261013' }}
      DOC_VERSION: ${{ vars.LIVEDOCS_VERSION || 'v1' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: documentation-bundle
          path: artifacts
      - name: Upload verified documentation bundle and receipt
        shell: bash
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.LIVEDOCS_STORAGE_SAS_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$AZURE_STORAGE_SAS_TOKEN" || { echo 'Missing secret: LIVEDOCS_STORAGE_SAS_TOKEN' >&2; exit 1; }
          [[ "$ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]] || { echo 'Invalid LiveDocs storage account' >&2; exit 1; }
          [[ "$DOC_VERSION" =~ ^v[1-9][0-9]*$ ]] || { echo 'Invalid LiveDocs version' >&2; exit 1; }

          bundle=artifacts/documentation-bundle.zip
          metadata="$RUNNER_TEMP/documentation-metadata.json"
          unzip -p "$bundle" bundle.json > "$metadata"
          jq -e --arg repository "$SOURCE_REPOSITORY" --arg commit "$SOURCE_COMMIT" --argjson run "$SOURCE_RUN_ID" \
            '.schemaVersion == 1 and .project == "payments" and .repository == $repository and .commitSha == $commit and .workflowRunId == $run and (.generatedAt | type == "string")' \
            "$metadata" > /dev/null
          digest=$(sha256sum "$bundle" | cut -d ' ' -f 1)
          size=$(stat -c %s "$bundle")
          bundle_name="reports/payments/$SOURCE_COMMIT/$digest.zip"
          receipt_name="candidates/$DOC_VERSION/payments/$SOURCE_RUN_ID-$digest.json"
          bundle_url="https://$ACCOUNT.blob.core.windows.net/livedocs/$bundle_name"
          receipt=artifacts/documentation-reference.json
          jq --arg version "$DOC_VERSION" --arg url "$bundle_url" --arg digest "$digest" --argjson size "$size" \
            '{schemaVersion: 1, version: $version, reference: {project: .project, commitSha: .commitSha, generatedAt: .generatedAt, workflowRunId: .workflowRunId, artifact: {url: $url, sha256: $digest, sizeBytes: $size}}}' \
            "$metadata" > "$receipt"

          storage=(--account-name "$ACCOUNT" --container-name livedocs --sas-token "$AZURE_STORAGE_SAS_TOKEN" --only-show-errors)
          upload_once() {
            local file="$1" name="$2" content_type="$3" exists existing
            exists=$(az storage blob exists "${storage[@]}" --name "$name" --query exists --output tsv)
            case "$exists" in
              true|True)
                existing="$RUNNER_TEMP/existing-$(basename "$file")"
                az storage blob download "${storage[@]}" --name "$name" --file "$existing" --overwrite true --output none
                cmp --silent "$file" "$existing" || { echo "Immutable Blob has different bytes: $name" >&2; return 1; }
                ;;
              false|False)
                az storage blob upload "${storage[@]}" --name "$name" --file "$file" --content-type "$content_type" \
                  --overwrite false --if-none-match '*' --validate-content --output none
                ;;
              *) echo 'Unexpected Blob existence response' >&2; return 1 ;;
            esac
          }

          upload_once "$bundle" "$bundle_name" application/zip
          upload_once "$receipt" "$receipt_name" application/json
          printf 'Payments documentation archived.\n\nBundle: %s\n\nReceipt: https://%s.blob.core.windows.net/livedocs/%s\n' \
            "$bundle_url" "$ACCOUNT" "$receipt_name" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-reference
          path: artifacts/documentation-reference.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
