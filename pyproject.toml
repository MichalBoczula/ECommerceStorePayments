[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-store-payments"
version = "0.1.0"
description = "Payment service for the ECommerce Store portfolio."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx==0.28.1",
    "microsoft-kiota-abstractions==1.14.1",
    "microsoft-kiota-http==1.14.1",
    "microsoft-kiota-serialization-form==1.14.1",
    "microsoft-kiota-serialization-json==1.14.1",
    "microsoft-kiota-serialization-multipart==1.14.1",
    "microsoft-kiota-serialization-text==1.14.1",
    "microsoft-kiota-abstractions>=1.9,<2",
    "microsoft-kiota-http>=1.9,<2",
    "microsoft-kiota-serialization-form>=1.9,<2",
    "microsoft-kiota-serialization-json>=1.9,<2",
    "microsoft-kiota-serialization-multipart>=1.9,<2",
    "microsoft-kiota-serialization-text>=1.9,<2",
    "pydantic-settings>=2.10,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.14,<3",
    "httpx2>=2.13,<3",
    "jsonschema==4.25.1",
    "openapi-spec-validator==0.7.2",
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "testcontainers[mongodb]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_store_payments"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/ecommerce_store_payments"]
omit = ["*/infrastructure/clients/orders/generated/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/ecommerce_store_payments/infrastructure/clients/orders/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_store_payments"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/ecommerce_store_payments/infrastructure/clients/orders/generated"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv]
required-version = "==0.12.18"
