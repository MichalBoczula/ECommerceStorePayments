[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-store-payments"
version = "0.1.0"
description = "Payment service for the ECommerce Store portfolio."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.14,<3",
    "httpx>=0.28,<1",
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "testcontainers[mongodb]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_store_payments"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/ecommerce_store_payments --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/ecommerce_store_payments"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_store_payments"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
